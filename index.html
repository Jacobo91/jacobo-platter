<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Sellers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@200;300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .font-bebas {
            font-family: 'Bebas Neue', sans-serif;
        }
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
        .font-source-pro {
            font-family: 'Source Serif Pro', serif;
        }
    </style>
</head>
<body>
    <section id="bestsellers__section" class="md:pl-[64px] lg:pl-[128px] mb-[36px] md:mb-[100px]">
        <h1 class="text-[28px] md:text-[40px] font-bold mb-6 md:mb-[36px] font-source-pro text-center md:text-left mt-[36px] md:mt-[80px]">Best Sellers</h1>

        <div id="product-grid" class="flex gap-x-[11px] gap-y-[12px] md:gap-y-[0px] md:gap-x-[24px] flex-wrap justify-center md:flex-nowrap md:overflow-x-scroll md:justify-start md:pb-[52px]">
            <!-- Template for product cards -->
             <template id="product-card-template" class="product-grid">

                <a class="relative inline-block w-[158px] md:w-[353px]">
                    <!-- tags -->
                    <div id="tags-container" class="absolute top-0 z-10 flex justify-between w-full p-[4px] md:p-[8px] font-bebas"></div>
                    
                    <div id="image-wrapper" class="relative overflow-hidden rounded-[10px]">
                        <image id="featured-image" class="w-full object-fit aspect-[1/1]"/>
                    </div>
    
                    <div id="product-info" class="pt-[12px] pb-[8px] pl-[8px] md:p-[16px] md:pl-[12px] flex flex-col gap-[8px] md:gap-[11px]">
                        <h2 id="product-title" class="text-[16px] md:text-[18px] uppercase font-bebas tracking-[0.48px] md:tracking-[0.54px]"></h2>
                        <div id="product-rating" class="font-poppins text-[11px] md:text-[12px] flex items-center gap-[4px]">
                            <div class="md:hidden">
                                <img src="/assets/stars-mobile.png" alt="stars rating">
                            </div>
                            <div class="hidden md:block">
                                <img src="/assets/stars.png" alt="stars rating">
                            </div>
                            1,234 Reviews
                        </div>
                        <span id="product-price" class="font-poppins text-[16px] font-medium"></span>
                    </div>
                </a>


             </template>
            </div>
            <button id="show-more-button" class="w-[327px] block rounded-full text-white bg-[#1C1D1D] font-poppins text-[16px] font-semibold px-[8px] py-[16px] ml-[auto] mr-[auto] mt-[12px] [@media(min-width:496px)]:hidden">Show More</button>
    </section>

    <script src="index.js" defer></script>
</body>
</html>

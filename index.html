<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Sellers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <section id="bestsellers__section">
        <h1 class="text-2xl font-bold mb-6">Best Sellers</h1>

        <div id="product-grid" class="flex">
            <!-- Template for product cards -->
             <template id="product-card-template" class="product-grid">

                <a class="relative inline-block">
                    <!-- tags -->
                    <div class="absolute top-0 z-10 flex justify-between w-full p-2">
                        <span>bestseller</span>
                        <span>save 15%</span>
                    </div>
                    <div id="image-wrapper" class="relative w-[355px] overflow-hidden">
    
                        <image id="featured-image" class="w-full object-fit aspect-[1/1]"/>
 
                    </div>
    
                    <h2 id="product-title"></h2>
                    <div id="product-rating"></div>
                    <span id="product-price"></span>
                </a>


             </template>
        </div>
    </section>

    <script src="index.js" defer></script>
</body>
</html>
